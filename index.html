<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>硬邦邦的香蕉 — AI Photoshop 插件</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#000;
  --panel:#0b0b0b;
  --text:#f5f5f7;
  --muted:#86868b;
  --line:#1d1d1f;
  --accent:#0071e3;
  --yellow:#F5C93A;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:var(--bg);
  color:var(--text);
  font-family:Inter, system-ui, -apple-system, sans-serif;
  -webkit-font-smoothing:antialiased;
}

a{color:inherit;text-decoration:none}

/* NAV */
nav{
  position:sticky;
  top:0;
  z-index:10;
  backdrop-filter: blur(12px);
  background:rgba(0,0,0,0.6);
  border-bottom:1px solid var(--line);

  display:flex;
  justify-content:space-between;
  align-items:center;

  padding:16px 28px;
}

.logo{
  display:flex;
  align-items:center;
  gap:10px;
  font-weight:600;
  letter-spacing:-0.02em;
}

.logo span{
  background:var(--yellow);
  color:#000;
  padding:2px 6px;
  border-radius:6px;
  font-size:12px;
}

/* HERO */
.hero{
  text-align:center;
  padding:120px 20px 60px;
  max-width:900px;
  margin:auto;
}

h1{
  font-size:56px;
  font-weight:700;
  letter-spacing:-0.03em;
  line-height:1.05;
}

h1 span{
  color:var(--yellow);
}

.sub{
  margin-top:18px;
  color:var(--muted);
  font-size:15px;
  line-height:1.6;
}

/* BUTTONS */
.actions{
  margin-top:28px;
  display:flex;
  gap:12px;
  justify-content:center;
  flex-wrap:wrap;
}

.btn{
  padding:12px 20px;
  border-radius:999px;
  font-size:14px;
  font-weight:600;
  cursor:pointer;
  transition:all .25s ease;
  border:1px solid transparent;
}

.primary{
  background:var(--accent);
  color:#fff;
}

.primary:hover{
  transform:scale(1.03);
}

.secondary{
  background:transparent;
  border:1px solid var(--line);
  color:var(--text);
}

.secondary:hover{
  border-color:#333;
}

/* SECTION CARD */
.section{
  max-width:1000px;
  margin:0 auto;
  padding:80px 20px;
}

/* DEMO */
.demo{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:16px;
  overflow:hidden;
}

.demo-top{
  padding:12px 16px;
  font-size:12px;
  color:var(--muted);
  border-bottom:1px solid var(--line);
}

.demo-body{
  display:grid;
  grid-template-columns:220px 1fr;
  min-height:320px;
}

.tools{
  padding:16px;
  border-right:1px solid var(--line);
  color:var(--muted);
  font-size:13px;
  line-height:1.6;
}

.canvas{
  display:flex;
  align-items:center;
  justify-content:center;
  background:#111;
  color:var(--muted);
}

/* PRICE */
.price{
  text-align:center;
}

.card{
  display:inline-block;
  padding:42px 48px;
  border-radius:20px;
  background:var(--panel);
  border:1px solid var(--line);
}

.big{
  font-size:54px;
  font-weight:700;
  color:var(--yellow);
  margin:10px 0;
}

/* CHAT */
.chat-btn{
  position:fixed;
  right:20px;
  bottom:20px;
  width:52px;
  height:52px;
  border-radius:50%;
  background:var(--yellow);
  color:#000;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  font-size:18px;
  box-shadow:0 10px 30px rgba(0,0,0,0.4);
}

.chat{
  position:fixed;
  right:20px;
  bottom:85px;
  width:300px;
  height:360px;
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:14px;
  display:none;
  flex-direction:column;
  overflow:hidden;
}

.chat-header{
  padding:12px;
  font-size:12px;
  border-bottom:1px solid var(--line);
  color:var(--muted);
}

.chat-body{
  flex:1;
  padding:12px;
  font-size:13px;
  color:var(--muted);
}

.chat-input{
  border:none;
  padding:12px;
  background:#111;
  color:#fff;
  outline:none;
}

/* MOBILE */
@media(max-width:768px){
  h1{font-size:38px;}
  .demo-body{grid-template-columns:1fr;}
  .tools{border-right:none;border-bottom:1px solid var(--line);}
}
</style>
</head>

<body>

<nav>
  <div class="logo">🍌 <span>AI</span> 硬邦邦的香蕉</div>
  <div style="color:var(--muted);font-size:13px">Photoshop 插件</div>
</nav>

<div class="hero">
  <h1>AI 生成填充<br><span>Photoshop 内直接完成</span></h1>

  <p class="sub">
    选区 → 输入提示词 → 一键生成<br>
    无需导出，无需切软件，无需流程成本
  </p>

  <div class="actions">
    <button class="btn primary">立即购买 ¥49</button>
    <button class="btn secondary">查看演示</button>
  </div>
</div>

<div class="section">
  <div class="demo">
    <div class="demo-top">Photoshop 插件运行界面</div>

    <div class="demo-body">
      <div class="tools">
        选区工具<br><br>
        矩形选框<br>
        套索工具<br>
        魔棒工具<br><br>
        状态：已就绪
      </div>

      <div class="canvas">
        示例画布 / AI 生成区域
      </div>
    </div>
  </div>
</div>

<div class="section price">
  <div class="card">
    <div style="color:var(--muted);font-size:13px">永久授权</div>
    <div class="big">¥49</div>
    <div style="color:var(--muted);font-size:13px">
      一次购买，终身使用
    </div>
    <div style="margin-top:20px">
      <button class="btn primary">立即获取 License</button>
    </div>
  </div>
</div>

<div class="chat-btn" onclick="toggleChat()">💬</div>

<div class="chat" id="chat">
  <div class="chat-header">AI 客服</div>
  <div class="chat-body">可以问安装 / 激活 / 报错问题</div>
  <input class="chat-input" placeholder="输入问题..." />
</div>

<script>
function toggleChat(){
  const c=document.getElementById('chat');
  c.style.display = (c.style.display==='flex')?'none':'flex';
}
</script>

</body>
</html>
