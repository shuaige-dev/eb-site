<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>硬邦邦的香蕉 — AI Photoshop 插件</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="./style.css">
</head>

<body>

<nav>
  <!-- 图4已改为纯文字 -->
  <div class="logo">硬邦邦的香蕉</div>
  <div class="subnav">Photoshop 插件</div>
</nav>

<section class="hero">
  <h1>AI 生成填充<br><span>Photoshop 内直接完成</span></h1>

  <p class="sub">
    选区 → 输入提示词 → 一键生成<br>
    无需导出，无需切软件，无需流程成本
  </p>

  <!-- 图3修改：下载及二级菜单结构 -->
  <div class="actions-container">
    <div class="actions">
      <button class="btn primary" onclick="toggleDownloadMenu(event)">下载</button>
      <button class="btn secondary" onclick="scrollToPrice()">查看演示</button>
    </div>
    
    <div class="sub-menu" id="downloadMenu">
      <a href="#" class="sub-menu-item">免费试用下载</a>
      <div class="divider"></div>
      <a href="#" class="sub-menu-item data-activation" onclick="scrollToPrice()">输入授权码激活</a>
    </div>
  </div>
</section>

<section class="section">
  <div class="demo">
    <div class="demo-top">Photoshop 插件运行界面</div>

    <div class="demo-body">
      <div class="tools">
        选区工具<br><br>
        矩形选框<br>
        套索工具<br>
        魔棒工具<br><br>
        状态：已就绪
      </div>

      <div class="canvas">
        示例画布 / AI 生成区域
      </div>
    </div>
  </div>
</section>

<section class="section price">
  <div class="card">
    <div class="muted">永久授权</div>
    <div class="big">¥49</div>
    <div class="muted">一次购买，终身使用</div>

    <div style="margin-top:20px">
      <button class="btn primary">立即获取 License</button>
    </div>
  </div>
</section>

<script>
function toggleDownloadMenu(e) {
  e.stopPropagation();
  const menu = document.getElementById('downloadMenu');
  const isShow = menu.style.display === 'flex';
  menu.style.display = isShow ? 'none' : 'flex';
}

function scrollToPrice() {
  document.querySelector('.price').scrollIntoView({ behavior: 'smooth' });
  document.getElementById('downloadMenu').style.display = 'none';
}

// 点击页面其他地方自动收起二级菜单
document.addEventListener('click', () => {
  document.getElementById('downloadMenu').style.display = 'none';
});
</script>

</body>
</html>
