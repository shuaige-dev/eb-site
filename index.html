</footer>

<!-- AI 客服按钮 -->
<button class="ai-fab" id="aiFab" onclick="toggleAiPanel()" title="AI 助手">
  <div class="ai-fab-ring"></div>
  <svg width="22" height="22" viewBox="0 0 22 22" fill="none">

<script>
function toggleAiPanel() {
  document.getElementById('aiPanel').classList.toggle('open');
}

function toggleLicenseMenu(e) {
  e.stopPropagation();
  document.getElementById('licenseMenu').classList.toggle('open');
}

document.addEventListener('click', () => {
  document.getElementById('licenseMenu').classList.remove('open');
});

window.addEventListener('scroll', () => {
  document.getElementById('nav').classList.toggle('scrolled', window.scrollY > 20);
});
