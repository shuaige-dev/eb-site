<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>硬邦邦的香蕉 — Photoshop AI 生成填充</title>

<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  background:#0c0c0c;
  color:#f0f0f0;
  font-family:'Syne',sans-serif;
}

a{color:inherit;text-decoration:none}

/* NAV */
nav{
  display:flex;
  justify-content:space-between;
  padding:20px 40px;
  border-bottom:1px solid #222;
  position:sticky;
  top:0;
  background:rgba(12,12,12,0.9);
  backdrop-filter:blur(10px);
}

.logo{
  font-weight:700;
  display:flex;
  gap:10px;
  align-items:center;
}

.logo span{
  background:#F5C93A;
  color:#000;
  padding:4px 8px;
  border-radius:6px;
}

/* HERO */
.hero{
  text-align:center;
  padding:80px 20px 40px;
  max-width:800px;
  margin:auto;
}

h1{
  font-size:52px;
  margin:20px 0;
}

h1 span{color:#F5C93A}

.sub{
  color:#aaa;
  font-size:14px;
  line-height:1.6;
}

/* BUTTONS */
.btn{
  padding:14px 26px;
  border-radius:8px;
  cursor:pointer;
  border:none;
  font-weight:700;
}

.primary{
  background:#F5C93A;
  color:#000;
}

.secondary{
  background:transparent;
  border:1px solid #333;
  color:#fff;
}

/* DEMO */
.demo{
  margin:60px auto;
  max-width:900px;
  border:1px solid #222;
  border-radius:10px;
  overflow:hidden;
}

.demo-top{
  padding:10px;
  border-bottom:1px solid #222;
  font-size:12px;
  color:#888;
}

.demo-body{
  display:grid;
  grid-template-columns:200px 1fr;
  height:320px;
}

.tools{
  border-right:1px solid #222;
  padding:10px;
  font-size:12px;
  color:#aaa;
}

.canvas{
  display:flex;
  align-items:center;
  justify-content:center;
  background:#151515;
  position:relative;
}

.before{
  font-size:14px;
  color:#666;
}

/* PRICING */
.price{
  text-align:center;
  margin:80px 0;
}

.card{
  display:inline-block;
  border:1px solid #222;
  padding:40px;
  border-radius:12px;
  background:#141414;
}

.big{
  font-size:48px;
  color:#F5C93A;
}

/* CHAT */
.chat-btn{
  position:fixed;
  right:20px;
  bottom:20px;
  width:54px;
  height:54px;
  border-radius:50%;
  background:#F5C93A;
  color:#000;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  font-size:20px;
}

.chat{
  position:fixed;
  right:20px;
  bottom:90px;
  width:280px;
  height:340px;
  background:#141414;
  border:1px solid #222;
  display:none;
  flex-direction:column;
}

.chat-header{
  padding:10px;
  border-bottom:1px solid #222;
  font-size:12px;
}

.chat-body{
  flex:1;
  padding:10px;
  font-size:12px;
  color:#aaa;
}

.chat-input{
  border:none;
  padding:10px;
  background:#1c1c1c;
  color:#fff;
}
</style>
</head>

<body>

<nav>
  <div class="logo">
    🍌 <span>AI</span> 硬邦邦的香蕉
  </div>
  <div>Photoshop 插件</div>
</nav>

<div class="hero">
  <h1>AI 生成填充<br><span>直接在 Photoshop 里</span></h1>
  <p class="sub">
    不切软件，不导出图片，不折腾流程<br>
    选区 → 输入提示词 → 一键生成
  </p>

  <div style="margin-top:20px">
    <button class="btn primary">立即购买 ¥49</button>
    <button class="btn secondary">查看演示</button>
  </div>
</div>

<!-- DEMO -->
<div class="demo">
  <div class="demo-top">Photoshop 插件运行界面</div>

  <div class="demo-body">
    <div class="tools">
      选区工具<br><br>
      ▪ 矩形选框<br>
      ▪ 套索工具<br>
      ▪ 魔棒工具<br><br>
      插件状态：已就绪
    </div>

    <div class="canvas">
      <div class="before">示例画布 / 生成区域</div>
    </div>
  </div>
</div>

<!-- PRICE -->
<div class="price">
  <div class="card">
    <div>永久授权</div>
    <div class="big">¥49</div>
    <div style="color:#888;font-size:13px;margin:10px 0">
      一次购买，终身使用
    </div>
    <button class="btn primary">立即获取 License</button>
  </div>
</div>

<!-- CHAT -->
<div class="chat-btn" onclick="toggleChat()">💬</div>

<div class="chat" id="chat">
  <div class="chat-header">AI 客服</div>
  <div class="chat-body">
    有问题可以问我，比如安装、激活、报错
  </div>
  <input class="chat-input" placeholder="输入问题..." />
</div>

<script>
function toggleChat(){
  const c=document.getElementById('chat');
  c.style.display = c.style.display==='flex'?'none':'flex';
}
</script>

</body>
</html>
